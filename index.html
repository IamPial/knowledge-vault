<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- favicon -->
    <link rel="icon" href="./assets/favicon/favicon.png" />

    <!-- css style -->
    <link rel="stylesheet" href="./style.css" />

    <title>Knowledge Vault</title>
  </head>
  <body>
    <header>
      <nav class="container">
        <div class="logo">
          <img src="./assets/logo-navbar.png" alt="Logo" />
        </div>

        <ul>
          <li><a href="">Features</a></li>
          <li><a href="">How It Works</a></li>
          <li><a href="">Why It's Different</a></li>
        </ul>

        <div>
          <button class="nav-btn">Get Early Access</button>
        </div>
      </nav>

      <!-- hero section start -->
      <section id="hero">
        <div class="container text-align">
          <div class="hero-subtitle">
            <img src="./assets/circle.png" alt="" />
            <span> Early Access Now Open</span>
          </div>

          <div class="hero-content">
            <h1>
              Structured thinking,<br />
              <span class="color-green">not just note-taking.</span>
            </h1>
            <p>
              A private space to store notes, links, and learning summaries —
              designed to <br />
              help you think clearly, connect ideas, and turn learning into
              long-term knowledge.
            </p>
            <div class="hero-btn">
              <button class="btn">
                Start Building Your Vault
                <i
                  class="fa-solid fa-arrow-right margin-left-10"
                  style="color: #ffffff"
                ></i>
              </button>
              <button class="btn bg-transparent">
                <i
                  class="fa-solid fa-play margin-right-10"
                  style="color: #ffffff"
                ></i
                >See How It Works
              </button>
            </div>
          </div>
        </div>
      </section>
      <!-- hero section end -->
    </header>
  </body>
</html>
